name: Deploy iFood distributed to Supabase

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: Type the target Supabase project ref to confirm
        required: true
        type: string
      confirm_migration_version:
        description: Type 20260717000000 to confirm the exact migration
        required: true
        type: string
      confirm_deploy:
        description: Confirm migration, secrets and function deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ifood-distributed-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy migration and iFood function
    if: ${{ inputs.confirm_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PROJECT_ID: hzvplpotsdzxygkxrgyi
      MIGRATION_VERSION: "20260717000000"
      MIGRATION_FILE: supabase/migrations/20260717000000_ifood_event_dedup.sql
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      IFOOD_DISTRIBUTED_CLIENT_ID: ${{ secrets.IFOOD_DISTRIBUTED_CLIENT_ID }}
      IFOOD_DISTRIBUTED_CLIENT_SECRET: ${{ secrets.IFOOD_DISTRIBUTED_CLIENT_SECRET }}
      IFOOD_PUBLIC_FUNCTION_URL: https://hzvplpotsdzxygkxrgyi.supabase.co/functions/v1/ifood

    steps:
      - name: Validate target and required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_project_ref }}" != "$PROJECT_ID" ]; then
            echo "::error::Target project confirmation does not match the Balcao Livre project."
            exit 1
          fi
          if [ "${{ inputs.confirm_migration_version }}" != "$MIGRATION_VERSION" ]; then
            echo "::error::Migration confirmation does not match the reviewed migration."
            exit 1
          fi
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD IFOOD_DISTRIBUTED_CLIENT_ID IFOOD_DISTRIBUTED_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.109.1

      - name: Verify pinned CLI surface
        shell: bash
        run: |
          set -euo pipefail
          supabase --version | grep -F "2.109.1"
          supabase link --help >/dev/null
          supabase db query --help >/dev/null
          supabase migration repair --help >/dev/null
          supabase functions deploy --help >/dev/null

      - name: Link the exact Supabase project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Inspect migration history before deployment
        run: supabase migration list --linked

      - name: Apply only the reviewed iFood migration
        run: >-
          supabase db query
          --linked
          --output table
          --file "$MIGRATION_FILE"

      - name: Verify database postconditions
        run: >-
          supabase db query
          --linked
          --output table
          --file supabase/tests/ifood_distributed_deploy_verify.sql

      - name: Register the exact migration in Supabase history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair "$MIGRATION_VERSION" --status applied --linked
          supabase db query --linked --output table "do \$verify\$ begin if not exists (select 1 from supabase_migrations.schema_migrations where version = '$MIGRATION_VERSION') then raise exception 'Migration iFood nao registrada no historico.'; end if; end \$verify\$;"
          supabase migration list --linked

      - name: Configure distributed iFood secrets
        run: >-
          supabase secrets set
          --project-ref "$PROJECT_ID"
          "IFOOD_DISTRIBUTED_CLIENT_ID=$IFOOD_DISTRIBUTED_CLIENT_ID"
          "IFOOD_DISTRIBUTED_CLIENT_SECRET=$IFOOD_DISTRIBUTED_CLIENT_SECRET"
          "IFOOD_PUBLIC_FUNCTION_URL=$IFOOD_PUBLIC_FUNCTION_URL"

      - name: Deploy the iFood Edge Function
        run: >-
          supabase functions deploy ifood
          --project-ref "$PROJECT_ID"
          --use-api

      - name: Verify deployed function and secret names
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$PROJECT_ID"
          supabase secrets list --project-ref "$PROJECT_ID"

      - name: Smoke-test the public function route
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" "$IFOOD_PUBLIC_FUNCTION_URL")"
          if [ "$http_code" != "405" ]; then
            echo "::error::Expected HTTP 405 from the public iFood function root, received $http_code."
            sed -n '1,20p' "$response_file"
            exit 1
          fi
