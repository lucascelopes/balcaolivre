name: Agenda Livre Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
    paths:
      - "AgendaLivre.Flutter/**"
      - ".github/workflows/agenda-windows-build.yml"

permissions:
  contents: read

concurrency:
  group: agenda-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar aplicativo Windows
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.7"
          cache: true

      - name: Validar e compilar
        shell: pwsh
        working-directory: AgendaLivre.Flutter
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter analyze --no-pub
          flutter build windows --release --no-pub

      - name: Empacotar aplicativo
        shell: pwsh
        run: |
          $source = Resolve-Path "AgendaLivre.Flutter/build/windows/x64/runner/Release"
          $archive = Join-Path $env:RUNNER_TEMP "AgendaLivre-Windows.zip"
          Compress-Archive -Path (Join-Path $source "*") -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT
        id: package

      - name: Disponibilizar pacote
        uses: actions/upload-artifact@v4
        with:
          name: AgendaLivre-Windows
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
